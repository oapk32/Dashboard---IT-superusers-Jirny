  <!-- ===== HESLO ===== -->
  <style>
    html.locked body > :not(#pwGate) { display: none !important; }
    #pwGate {
      position: fixed;
      inset: 0;
      z-index: 100000;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000e;
    }
    #pwGate form {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 28px 32px;
      border: 2px solid #ffffff66;
      border-radius: 12px;
      background: #151522;

      color: #fff;
      font: 700 1.2rem system-ui, sans-serif;
    }
    #pwGate input {
      padding: 10px 14px;
      border: 2px solid #ffffff66;
      border-radius: 8px;
      background: #000a;
      color: #fff;
      font: 1.2rem system-ui, sans-serif;
      text-align: center;
    }
    #pwGate button {
      padding: 10px 18px;
      border: 2px solid #ffffff66;
      border-radius: 8px;
      background: #0009;
      color: #ffd100;
      font: 700 1.1rem system-ui, sans-serif;
      cursor: pointer;
    }
    #pwError { min-height: 1.2em; color: red; font-size: 1rem; }
  </style>
  <script>
  (() => {
    const HASH = "fdba72deec5b7272a7ab516d72b4e009317df2172aa23c0a118bf7897d1f8082";
    const KEY = "dashboardHeslo";
    try { if (localStorage.getItem(KEY) === HASH) return; } catch {}

    document.documentElement.classList.add("locked");

    async function sha256(text) {
      const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
      return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, "0")).join("");
    }

    document.addEventListener("DOMContentLoaded", () => {
      const gate = document.createElement("div");
      gate.id = "pwGate";
      gate.innerHTML = `
        <form>
          <div>🔒 Zadej heslo</div>
          <input type="password" autocomplete="current-password" autofocus>
          <button type="submit">Vstoupit</button>
          <div id="pwError"></div>
        </form>`;
      document.body.appendChild(gate);

      const input = gate.querySelector("input");
      input.focus();
      gate.querySelector("form").addEventListener("submit", async e => {
        e.preventDefault();
        if (await sha256(input.value) === HASH) {
          try { localStorage.setItem(KEY, HASH); } catch {}
          gate.remove();
          document.documentElement.classList.remove("locked");
        } else {
          gate.querySelector("#pwError").textContent = "Špatné heslo";
          input.value = "";
          input.focus();
        }
      });
    });
  })();
  </script>
  <!-- ===== HESLO END ===== -->

  <!-- ===== DVANÁCTKY START (po 14.12. smazat celý blok) ===== -->
  <div id="countdown12">--:--:--</div>
  <div id="ecommHell">Ecomm hell: <span id="ecommHellTime">--</span></div>
  <style>
    #countdown12Wrap {
      position: relative;
    }
    #countdown12 {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%) rotate(22deg);
      white-space: nowrap;
      pointer-events: none;
      z-index: 5;
      font-size: 6.5rem;
      font-weight: bold;
      letter-spacing: 0.1em;
      color: red;
      text-shadow: 0 0 8px #000;
    }
    #ecommHell {
      position: fixed;
      left: 20px;
      bottom: 70px;
      z-index: 9999;
      font-size: 1.6rem;
      font-weight: bold;
      color: red;
      text-shadow: 0 0 8px #000;
    }
  </style>
  <script>
  (() => {
    const KONEC = new Date(2026, 11, 14, 6, 0, 0); // 14.12.2026 6:00
    const el12 = document.getElementById("countdown12");
    const elHell = document.getElementById("ecommHell");
    const elHellTime = document.getElementById("ecommHellTime");
    const pad = n => String(n).padStart(2, "0");
    const hms = ms => {
      const s = Math.floor(ms / 1000);
      return `${pad(Math.floor(s / 3600))}:${pad(Math.floor((s % 3600) / 60))}:${pad(s % 60)}`;
    };

    function tick() {
      const now = new Date();
      if (now >= KONEC) {
        el12.style.display = "none";
        elHell.style.display = "none";
        return;
      }

      // 12h směny: střídání v 6:00 a 18:00
      const end = new Date(now);
      const h = now.getHours();
      if (h >= 6 && h < 18) end.setHours(18, 0, 0, 0);
      else if (h >= 18) { end.setDate(end.getDate() + 1); end.setHours(6, 0, 0, 0); }
      else end.setHours(6, 0, 0, 0);
      el12.textContent = hms(end - now);

      // Ecomm hell do 14.12. 6:00
      const diff = KONEC - now;
      const dny = Math.floor(diff / 86400000);
      elHellTime.textContent = `${dny}d ${hms(diff % 86400000)}`;
    }

    tick();
    setInterval(tick, 1000);

    document.addEventListener("DOMContentLoaded", () => {
      // Červený odpočet šikmo přes 8h časovač
      const cd = document.getElementById("countdown");
      const wrap = document.createElement("div");
      wrap.id = "countdown12Wrap";
      cd.parentNode.insertBefore(wrap, cd);
      wrap.append(cd, el12);

      // Shiftleader: Studená -> Umachanov (jen po dobu dvanáctek)
      const workers = document.getElementById("currentWorkers");
      const prejmenuj = () => {
        if (new Date() < KONEC && workers.innerHTML.includes("Studená")) {
          workers.innerHTML = workers.innerHTML.replaceAll("Studená", "Umachanov");
        }
      };
      new MutationObserver(prejmenuj).observe(workers, { childList: true, subtree: true, characterData: true });
      prejmenuj();
    });
  })();
  </script>
  <!-- ===== DVANÁCTKY END ===== -->

	<div id="namedayWidget" style="margin:14px auto 0;padding:10px 18px;max-width:calc(100vw - 36px);border:2px solid #ffffff66;border-radius:12px;background:#000a;text-align:center;box-shadow:0 0 14px #000;z-index:5;">

  <div id="namedayName" style="font:700 1.3rem system-ui,sans-serif;color:#fff;">Načítám…</div>
</div>

<script>
(() => {
  const box = document.getElementById('namedayWidget');
  const output = document.getElementById('namedayName');
  const vybranaJmena = new Set([
    'ondrej', 'milos', 'petr', 'miroslav', 'zdenek', 'marek', 'david'
  ]);
  let posledniDen = '';

  function prazskeDatum() {
    const casti = new Intl.DateTimeFormat('en-GB', {
      timeZone: 'Europe/Prague',
      year: 'numeric', month: '2-digit', day: '2-digit'
    }).formatToParts(new Date());
    const d = Object.fromEntries(casti.map(c => [c.type, c.value]));
    return `${d.year}-${d.month}-${d.day}`;
  }

  function zobraz(jmeno) {
    const bezDiakritiky = jmeno.normalize('NFD')
      .replace(/[\u0300-\u036f]/g, '')
      .toLocaleLowerCase('cs-CZ');
    const vybrane = bezDiakritiky.split(/[^a-z]+/)
      .some(cast => vybranaJmena.has(cast));

    output.textContent = jmeno;
    output.style.fontSize = vybrane ? '2.1rem' : '1.3rem';
    output.style.fontWeight = vybrane ? '900' : '700';
    output.style.color = vybrane ? '#ffdb54' : '#fff';
    output.style.textShadow = vybrane ? '0 0 16px #ff8a00' : 'none';
    box.style.borderColor = vybrane ? '#ffdb54' : '#ffffff66';
  }

  async function nactiSvatek() {
    const den = prazskeDatum();
    if (den === posledniDen) return;
    posledniDen = den;

    try {
      const odpoved = await fetch(`https://svatkyapi.netlify.app/api/day/${den}`);
      if (!odpoved.ok) throw new Error('API');
      const data = await odpoved.json();
      if (!data.name) throw new Error('Chybí jméno');
      zobraz(data.name);
    } catch {
      output.textContent = 'Svátek se nepodařilo načíst';
      posledniDen = ''; // zkusí to znovu při další kontrole
    }
  }

  nactiSvatek();
  setInterval(nactiSvatek, 60 * 1000);
})();
</script>
