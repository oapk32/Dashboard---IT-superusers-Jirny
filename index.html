  <div id="namedayName" style="font:700 1.3rem system-ui,sans-serif;color:#fff;">Načítám…</div>
</div>

<script>
(() => {
  const box = document.getElementById('namedayWidget');
  const output = document.getElementById('namedayName');
  const vybranaJmena = new Set([
    'ondrej', 'milos', 'petr', 'miroslav', 'zdenek', 'marek', 'david'
  ]);
  let posledniDen = '';

  function prazskeDatum() {
    const casti = new Intl.DateTimeFormat('en-GB', {
      timeZone: 'Europe/Prague',
      year: 'numeric', month: '2-digit', day: '2-digit'
    }).formatToParts(new Date());
    const d = Object.fromEntries(casti.map(c => [c.type, c.value]));
    return `${d.year}-${d.month}-${d.day}`;
  }

  function zobraz(jmeno) {
    const bezDiakritiky = jmeno.normalize('NFD')
      .replace(/[\u0300-\u036f]/g, '')
      .toLocaleLowerCase('cs-CZ');
    const vybrane = bezDiakritiky.split(/[^a-z]+/)
      .some(cast => vybranaJmena.has(cast));

    output.textContent = jmeno;
    output.style.fontSize = vybrane ? '2.1rem' : '1.3rem';
    output.style.fontWeight = vybrane ? '900' : '700';
    output.style.color = vybrane ? '#ffdb54' : '#fff';
    output.style.textShadow = vybrane ? '0 0 16px #ff8a00' : 'none';
    box.style.borderColor = vybrane ? '#ffdb54' : '#ffffff66';
  }

  async function nactiSvatek() {
    const den = prazskeDatum();
    if (den === posledniDen) return;
    posledniDen = den;

    try {
      const odpoved = await fetch(`https://svatkyapi.netlify.app/api/day/${den}`);
      if (!odpoved.ok) throw new Error('API');
      const data = await odpoved.json();
      if (!data.name) throw new Error('Chybí jméno');
      zobraz(data.name);
    } catch {
      output.textContent = 'Svátek se nepodařilo načíst';
      posledniDen = ''; // zkusí to znovu při další kontrole
    }
  }

  nactiSvatek();
  setInterval(nactiSvatek, 60 * 1000);
})();
</script>

<script type="module">

import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";


    const supabaseUrl = "https://dmhzzznwmhkbjnyciiyy.supabase.co/";
    const supabaseKey = "sb_publishable_w9p6rnBiKUSoU9E-SHChAg_emDim_fj";
    const supabase = createClient(supabaseUrl, supabaseKey);


async function refreshChat() {



    const { data, error } = await supabase
        .from("chatos")
        .select("name, msg")
        .order("id", { ascending: false });

    if (error) {
        console.error(error);
        return;
    }

    const list = document.getElementById("chatos");
    const container = document.getElementById("chat-container");

    list.innerHTML = "";

    data.forEach(row => {
        const li = document.createElement("li");
        li.textContent = `${row.name}: ${row.msg}`;
        list.appendChild(li);
    });

    container.scrollTop = container.scrollHeight;
}


refreshChat();


setInterval(refreshChat, 3000);


const form = document.getElementById("chat-form");

form.addEventListener("submit", async (e) => {
    e.preventDefault(); 

    const nameInput = document.getElementById("name");
    const msgInput = document.getElementById("msg");

    const name = nameInput.value.trim();
    const msg = msgInput.value.trim();

    if (!name || !msg) return;

    const { error } = await supabase
        .from("chatos")
        .insert([{ name, msg }]);

    if (error) {
        console.error("Chyba při odesílání:", error);
        return;
    }

   
    msgInput.value = "";

   
    refreshChat();
});

</script>
